<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poker Tracker">
<meta name="theme-color" content="#0f1a14">
<title>Poker Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #0f1a14;
    --panel: #16241c;
    --panel-2: #1d3025;
    --line: #2a4436;
    --text: #e8f2ec;
    --muted: #8fa89a;
    --green: #35d07f;
    --red: #ff5d5d;
    --gold: #f2c14e;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-user-select: none;
    user-select: none;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,26,20,.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--green); }
  .container { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }

  .balance-card {
    background: linear-gradient(135deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    text-align: center;
    margin-bottom: 14px;
  }
  .balance-card .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .balance-card .value { font-size: 40px; font-weight: 700; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .balance-card .value.pos { color: var(--green); }
  .balance-card .value.neg { color: var(--red); }
  .stats-row { display: flex; gap: 8px; margin-top: 12px; }
  .stat {
    flex: 1; background: rgba(0,0,0,.25); border-radius: 10px; padding: 8px 4px;
    font-size: 12px; color: var(--muted);
  }
  .stat b { display: block; font-size: 15px; color: var(--text); margin-top: 2px; font-variant-numeric: tabular-nums; }

  section.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  section.panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }

  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; background: #0d1712; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; font-size: 17px; font-family: inherit;
    -webkit-user-select: text; user-select: text;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--green); }
  .field textarea { min-height: 56px; resize: vertical; }
  .two-col { display: flex; gap: 10px; }
  .two-col .field { flex: 1; }

  .result-preview {
    text-align: center; font-size: 24px; font-weight: 700;
    padding: 10px; border-radius: 10px; margin: 4px 0 12px;
    background: rgba(0,0,0,.25); font-variant-numeric: tabular-nums;
  }
  .result-preview.pos { color: var(--green); }
  .result-preview.neg { color: var(--red); }
  .result-preview.zero { color: var(--muted); }

  button {
    font-family: inherit; font-size: 16px; font-weight: 600;
    border: none; border-radius: 10px; padding: 13px 16px;
    cursor: pointer; color: #06130c; background: var(--green);
    width: 100%;
  }
  button:active { opacity: .8; }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-row { display: flex; gap: 10px; }
  .btn-row button { flex: 1; }

  .session {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--green);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .session.loss { border-left-color: var(--red); }
  .session .info { flex: 1; min-width: 0; }
  .session .date { font-size: 13px; color: var(--muted); }
  .session .title { font-size: 15px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session .detail { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .session .amount { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .session .amount.pos { color: var(--green); }
  .session .amount.neg { color: var(--red); }
  .session .icon-btn {
    background: none; border: none; color: var(--muted); font-size: 20px;
    padding: 6px; width: auto;
  }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 15px; }

  .month-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,.18);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .month-row:active { opacity: .8; }
  .month-row.active { border-color: var(--green); background: rgba(53,208,127,.1); }
  .month-row .m-name { font-size: 15px; font-weight: 600; }
  .month-row .m-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .month-row .m-amt { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .month-row .m-amt.pos { color: var(--green); }
  .month-row .m-amt.neg { color: var(--red); }
  .month-row .m-amt.zero { color: var(--muted); }

  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .toolbar button { font-size: 14px; padding: 10px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--line); font-size: 14px; padding: 9px;
  }
  .tabs button.active { color: var(--text); border-color: var(--green); background: rgba(53,208,127,.12); }

  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    background: #000; color: #fff; border: 1px solid var(--line);
    padding: 11px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 100;
    max-width: 90%; text-align: center;
  }
  #toast.show { opacity: .95; }

  dialog {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; width: min(340px, 88vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 8px; font-size: 17px; }
  dialog p { color: var(--muted); font-size: 14px; margin: 0 0 16px; line-height: 1.45; }
  .hidden-file { display: none; }
</style>
</head>
<body>

<header>
  <h1>♠ Poker <span>Tracker</span></h1>
  <div style="font-size:13px;color:var(--muted)" id="sessionCount"></div>
</header>

<div class="container">

  <div class="balance-card">
    <div class="label">Общий баланс</div>
    <div class="value" id="balance">0</div>
    <div class="stats-row">
      <div class="stat">Сессий<b id="statCount">0</b></div>
      <div class="stat">Побед<b id="statWins">0</b></div>
      <div class="stat">Поражений<b id="statLosses">0</b></div>
      <div class="stat">Средний<b id="statAvg">0</b></div>
    </div>
  </div>

  <section class="panel" id="formPanel">
    <h2 id="formTitle">Новая сессия</h2>
    <div class="field">
      <label for="fDate">Дата</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label for="fTitle">Название / stakes (необязательно)</label>
      <input type="text" id="fTitle" placeholder="например: 1/2 Cash, Монте-Карло" autocomplete="off">
    </div>
    <div class="two-col">
      <div class="field">
        <label for="fBuyin">Бай-ин, $</label>
        <input type="number" id="fBuyin" inputmode="decimal" step="0.01" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="fCashout">Кешаут, $</label>
        <input type="number" id="fCashout" inputmode="decimal" step="0.01" min="0" placeholder="0">
      </div>
    </div>
    <div class="result-preview zero" id="resultPreview">Результат: 0</div>
    <div class="field">
      <label for="fNote">Заметка (необязательно)</label>
      <textarea id="fNote" placeholder="Комментарий к сессии"></textarea>
    </div>
    <div class="btn-row">
      <button id="btnSave">Сохранить</button>
      <button class="secondary" id="btnCancelEdit" style="display:none">Отмена</button>
    </div>
  </section>

  <div class="toolbar">
    <button class="secondary" id="btnExport">⬇︎ Экспорт</button>
    <button class="secondary" id="btnImport">⬆︎ Импорт</button>
  </div>
  <input type="file" id="fileInput" class="hidden-file" accept=".json,application/json">

  <section class="panel" style="padding-bottom:6px">
    <h2>История</h2>
    <div class="tabs">
      <button class="active" data-filter="all">Все</button>
      <button data-filter="month">Этот месяц</button>
      <button data-filter="win">Победы</button>
      <button data-filter="loss">Поражения</button>
    </div>
    <div id="history"></div>
  </section>

  <section class="panel">
    <h2>Статистика по месяцам</h2>
    <div id="monthStats"></div>
  </section>

</div>

<dialog id="confirmDialog">
  <h3 id="cdTitle">Подтверждение</h3>
  <p id="cdText"></p>
  <div class="btn-row">
    <button id="cdYes">Да</button>
    <button class="secondary" id="cdNo">Отмена</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var KEY = 'pokerTracker.sessions.v1';
  var sessions = [];
  var editingId = null;
  var filter = 'all';
  var MONTH_NAMES = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                     'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var data = raw ? JSON.parse(raw) : [];
      sessions = Array.isArray(data) ? data.filter(valid) : [];
    } catch (e) { sessions = []; }
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(sessions));
  }
  function valid(s) {
    return s && typeof s === 'object' && isFinite(s.buyin) && isFinite(s.cashout);
  }

  /* ---------- money ---------- */
  function money(n) {
    var sign = n < 0 ? '-' : '';
    var abs = Math.abs(n);
    var str = abs.toFixed(2).replace(/\.00$/, '');
    return sign + '$' + str.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }
  function round2(n) { return Math.round(n * 100) / 100; }
  function result(s) { return round2(s.cashout - s.buyin); }

  /* ---------- form ---------- */
  function updatePreview() {
    var b = parseFloat($('fBuyin').value) || 0;
    var c = parseFloat($('fCashout').value) || 0;
    var r = round2(c - b);
    var el = $('resultPreview');
    el.textContent = 'Результат: ' + money(r);
    el.className = 'result-preview ' + (r > 0 ? 'pos' : r < 0 ? 'neg' : 'zero');
  }
  ['fBuyin', 'fCashout'].forEach(function (id) {
    $(id).addEventListener('input', updatePreview);
  });

  function resetForm() {
    editingId = null;
    $('fTitle').value = '';
    $('fBuyin').value = '';
    $('fCashout').value = '';
    $('fNote').value = '';
    var d = new Date();
    $('fDate').value = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
    $('formTitle').textContent = 'Новая сессия';
    $('btnSave').textContent = 'Сохранить';
    $('btnCancelEdit').style.display = 'none';
    updatePreview();
  }

  function saveSession() {
    var buyin = parseFloat($('fBuyin').value);
    var cashout = parseFloat($('fCashout').value);
    if ($('fBuyin').value.trim() === '' || $('fCashout').value.trim() === '' ||
        !isFinite(buyin) || !isFinite(cashout)) {
      toast('Введите бай-ин и кешаут');
      return;
    }
    if (buyin < 0 || cashout < 0) { toast('Суммы не могут быть отрицательными'); return; }

    var rec = {
      id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)),
      date: $('fDate').value || new Date().toISOString().slice(0, 10),
      title: $('fTitle').value.trim(),
      note: $('fNote').value.trim(),
      buyin: round2(buyin),
      cashout: round2(cashout),
      created: Date.now()
    };

    if (editingId) {
      for (var i = 0; i < sessions.length; i++) {
        if (sessions[i].id === editingId) { rec.created = sessions[i].created; sessions[i] = rec; break; }
      }
      toast('Сессия обновлена');
    } else {
      sessions.push(rec);
      toast('Сессия сохранена');
    }
    save();
    resetForm();
    render();
    $('formPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function editSession(id) {
    var s = sessions.find(function (x) { return x.id === id; });
    if (!s) return;
    editingId = id;
    $('fDate').value = s.date;
    $('fTitle').value = s.title || '';
    $('fBuyin').value = s.buyin;
    $('fCashout').value = s.cashout;
    $('fNote').value = s.note || '';
    $('formTitle').textContent = 'Редактирование сессии';
    $('btnSave').textContent = 'Обновить';
    $('btnCancelEdit').style.display = '';
    updatePreview();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function deleteSession(id) {
    confirmAsk('Удалить сессию?', 'Сессия будет безвозвратно удалена из истории.', function () {
      sessions = sessions.filter(function (x) { return x.id !== id; });
      save();
      if (editingId === id) resetForm();
      render();
      toast('Сессия удалена');
    });
  }

  /* ---------- rendering ---------- */
  function formatDate(iso) {
    var p = String(iso).split('-');
    if (p.length !== 3) return iso;
    return p[2] + '.' + p[1] + '.' + p[0];
  }

  function filtered() {
    var now = new Date();
    var ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    return sessions.filter(function (s) {
      if (filter === 'month') return String(s.date).slice(0, 7) === ym;
      if (filter.indexOf('m:') === 0) return String(s.date).slice(0, 7) === filter.slice(2);
      if (filter === 'win') return result(s) > 0;
      if (filter === 'loss') return result(s) < 0;
      return true;
    }).sort(function (a, b) {
      if (a.date === b.date) return (b.created || 0) - (a.created || 0);
      return a.date < b.date ? 1 : -1;
    });
  }

  function renderMonths() {
    var map = {};
    sessions.forEach(function (s) {
      var ym = String(s.date).slice(0, 7);
      if (!/^\d{4}-\d{2}$/.test(ym)) return;
      if (!map[ym]) map[ym] = { ym: ym, total: 0, n: 0, w: 0, l: 0, buyin: 0, cashout: 0 };
      var m = map[ym];
      var r = result(s);
      m.total += r;
      m.n++;
      m.buyin += s.buyin;
      m.cashout += s.cashout;
      if (r > 0) m.w++; else if (r < 0) m.l++;
    });

    var box = $('monthStats');
    var keys = Object.keys(map).sort().reverse();
    if (!keys.length) {
      box.innerHTML = '<div class="empty">Статистика появится<br>после первой сессии</div>';
      return;
    }
    box.innerHTML = keys.map(function (k) {
      var m = map[k];
      m.total = round2(m.total);
      var parts = k.split('-');
      var name = MONTH_NAMES[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
      var active = filter === 'm:' + k ? ' active' : '';
      var acls = m.total > 0 ? 'pos' : m.total < 0 ? 'neg' : 'zero';
      return '<div class="month-row' + active + '" data-month="' + k + '">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="m-name">' + name + '</div>' +
          '<div class="m-sub">' + m.n + ' ' + plural(m.n, 'игра', 'игры', 'игр') +
            ' · ' + m.w + '✓ / ' + m.l + '✗' +
            ' · вход ' + money(round2(m.buyin)) + ' → выход ' + money(round2(m.cashout)) +
          '</div>' +
        '</div>' +
        '<div class="m-amt ' + acls + '">' + (m.total > 0 ? '+' : '') + money(m.total) + '</div>' +
      '</div>';
    }).join('');
  }

  function plural(n, one, few, many) {
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return one;
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
    return many;
  }

  $('monthStats').addEventListener('click', function (e) {
    var row = e.target.closest('[data-month]');
    if (!row) return;
    var ym = row.getAttribute('data-month');
    filter = (filter === 'm:' + ym) ? 'all' : 'm:' + ym;
    document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.remove('active'); });
    render();
    $('history').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function render() {
    renderMonths();

    /* summary */
    var total = 0, wins = 0, losses = 0;
    sessions.forEach(function (s) {
      var r = result(s);
      total += r;
      if (r > 0) wins++; else if (r < 0) losses++;
    });
    total = round2(total);

    var bal = $('balance');
    bal.textContent = money(total);
    bal.className = 'value ' + (total > 0 ? 'pos' : total < 0 ? 'neg' : '');

    $('statCount').textContent = sessions.length;
    $('statWins').textContent = wins;
    $('statLosses').textContent = losses;
    $('statAvg').textContent = sessions.length ? money(round2(total / sessions.length)) : '$0';
    $('sessionCount').textContent = sessions.length ? sessions.length + ' игр' : '';

    /* history */
    var list = filtered();
    var box = $('history');
    if (!list.length) {
      box.innerHTML = '<div class="empty">Пока нет сессий.<br>Добавьте первую выше ↑</div>';
      return;
    }
    box.innerHTML = list.map(function (s) {
      var r = result(s);
      var cls = r < 0 ? ' loss' : '';
      var acls = r > 0 ? 'pos' : r < 0 ? 'neg' : '';
      var title = s.title ? escapeHtml(s.title) : 'Кеш-игра';
      var note = s.note ? '<div class="detail">' + escapeHtml(s.note) + '</div>' : '';
      return '<div class="session' + cls + '">' +
        '<div class="info">' +
          '<div class="date">' + formatDate(s.date) + '</div>' +
          '<div class="title">' + title + '</div>' +
          '<div class="detail">Вход ' + money(s.buyin) + ' → Выход ' + money(s.cashout) + '</div>' +
          note +
        '</div>' +
        '<div class="amount ' + acls + '">' + (r > 0 ? '+' : '') + money(r) + '</div>' +
        '<button class="icon-btn" data-edit="' + s.id + '" aria-label="Изменить">✏️</button>' +
        '<button class="icon-btn" data-del="' + s.id + '" aria-label="Удалить">🗑</button>' +
      '</div>';
    }).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  $('history').addEventListener('click', function (e) {
    var t = e.target.closest('[data-edit],[data-del]');
    if (!t) return;
    if (t.hasAttribute('data-edit')) editSession(t.getAttribute('data-edit'));
    else deleteSession(t.getAttribute('data-del'));
  });

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      filter = b.getAttribute('data-filter');
      render();
    });
  });

  /* ---------- export / import ---------- */
  function exportBackup() {
    var payload = { app: 'poker-tracker', version: 1, exported: new Date().toISOString(), sessions: sessions };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'poker-tracker-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    toast('Резервная копия сохранена в файл');
  }

  $('btnExport').addEventListener('click', exportBackup);
  $('btnImport').addEventListener('click', function () { $('fileInput').click(); });

  $('fileInput').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(reader.result); } catch (err) { toast('Файл повреждён'); return; }
      var incoming = Array.isArray(data) ? data : (data && Array.isArray(data.sessions) ? data.sessions : null);
      if (!incoming || !incoming.every(valid)) { toast('Не тот формат файла'); return; }

      incoming = incoming.map(function (s) {
        return {
          id: s.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)),
          date: String(s.date || '').slice(0, 10) || new Date().toISOString().slice(0, 10),
          title: String(s.title || ''),
          note: String(s.note || ''),
          buyin: round2(+s.buyin),
          cashout: round2(+s.cashout),
          created: s.created || Date.now()
        };
      });

      confirmAsk(
        'Импорт данных',
        'Найдено сессий: ' + incoming.length + '. Объединить с текущими или заменить всю историю?',
        function () {
          var seen = {};
          sessions.forEach(function (s) { seen[s.id] = true; });
          incoming.forEach(function (s) { if (!seen[s.id]) { sessions.push(s); seen[s.id] = true; } });
          save(); render(); toast('Импорт выполнен: объединение');
        },
        function () {
          sessions = incoming;
          save(); resetForm(); render(); toast('Импорт выполнен: замена истории');
        }
      );
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ---------- dialog & toast ---------- */
  var cd = $('confirmDialog');
  var cdYesCb = null, cdNoCb = null;
  function confirmAsk(title, text, onYes, onNo) {
    $('cdTitle').textContent = title;
    $('cdText').textContent = text;
    $('cdYes').textContent = onNo ? 'Объединить' : 'Да';
    cdYesCb = onYes; cdNoCb = onNo || null;
    if (cd.showModal) cd.showModal(); else cd.setAttribute('open', '');
  }
  $('cdYes').addEventListener('click', function () {
    var cb = cdYesCb; cdYesCb = cdNoCb = null; cd.close(); if (cb) cb();
  });
  $('cdNo').addEventListener('click', function () {
    var cb = cdNoCb; cdYesCb = cdNoCb = null; cd.close(); if (cb) cb(); else toast('Отменено');
  });

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ---------- misc ---------- */
  $('btnSave').addEventListener('click', saveSession);
  $('btnCancelEdit').addEventListener('click', function () { resetForm(); render(); });

  load();
  resetForm();
  render();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
